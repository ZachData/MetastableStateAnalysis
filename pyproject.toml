# pyproject.toml — dependency declaration and test configuration.
#
# Until this file existed there was no machine-readable statement of what the
# project needs to run, which meant CI could not be written at all: a workflow
# has to install something, and nothing said what. The three tiers below match
# the three things the code actually needs, and mirror requirements/*.txt so
# either entry point installs the same set.
#
#   base  — numpy, scipy. Everything in core/ that is torch-optional by design
#           (core.metrics documents this; core.particles states the
#           no-new-dependency norm explicitly).
#   test  — base + pytest. The gating CI tier runs on exactly this.
#   heavy — test + torch, transformers, matplotlib, scikit-learn. Real forward
#           passes, clustering, and figure generation.
#
# Note for CI authors: install torch from the CPU index
# (https://download.pytorch.org/whl/cpu). The plain PyPI wheel is the CUDA
# build and is ~4.9 GB unpacked.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metastable-state-analysis"
version = "0.1.0"
description = "Metastable-state / interacting-particle analysis of transformer activations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]
heavy = [
    "pytest>=7.4",
    "torch>=2.0",
    # <5: see requirements/heavy.txt -- transformers 5 moved GPTNeoX rotary
    # geometry into config.rope_parameters and core/rope.py silently defaults
    # rotary_pct to 1.0 when it is absent.
    "transformers>=4.35,<5",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools]
# Every name here must be a real importable package in the repo root, i.e. a
# directory with an __init__.py. Two ways this list has gone stale, both of
# which `pip install -e . --no-deps` catches and nothing else does:
#
#   * a phase gets archived and its name is left behind. setuptools raises
#     "package directory 'X' does not exist" and the editable install fails
#     outright. p3_crosscoder and p4_mstate_features sat here after their code
#     moved to archive/. Note that a stale __pycache__/ left in the root from
#     before the move hides this -- the directory exists, so the build passes
#     on that machine and fails on a fresh clone.
#   * a phase gets archived but keeps a math-*.md in the root, so the directory
#     survives with no __init__.py and no .py at all. The build then succeeds
#     while declaring something that is not a package. p5_single_mstate_analysis
#     and p5b_manifold_steering were in that state.
#
# And the failure that costs something rather than just erroring: a NEW phase's
# package not being added. p7_motifs was missing while holding the current
# phase's code, so an install of this project shipped without it.
packages = [
    "core",
    "tools",
    "p1_mstate_tracking",
    "p1b_hemisphere",
    "p1c_frames",
    "p2_eigenspectra",
    "p2b_imaginary",
    "p2d_operator_activation",
    "p6_subspace",
    "p7_motifs",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
# Configuration lives in pytest.ini, NOT here. pytest.ini takes absolute
# precedence: when it exists, [tool.pytest.ini_options] is not read at all, so
# a markers block in this file would look authoritative while being ignored.
# That is not hypothetical -- it happened when main's pytest.ini merged with
# this file's markers block, and every tier marker silently unregistered.
