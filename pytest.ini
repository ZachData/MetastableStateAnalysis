[pytest]
# Live phases only. archive/ holds Phases 3, 4, 5, 5b, 5c and 6 — code that is
# not maintained, not imported by anything live, and whose tests are therefore
# not collected. See archive/README.md.
testpaths = tests
norecursedirs = archive .git __pycache__ results

# The project root must be importable: tests/conftest.py does
# `from tests.test_config import ...`, and tests/ has no __init__.py, so
# pytest's default prepend import mode puts tests/ on sys.path rather than the
# root. `python -m pytest` papers over it (Python prepends the cwd); the bare
# `pytest` console script does not, which is how it reached CI.
pythonpath = .

# Tiers are defined by *what a runner must have installed*, and each module's
# tier was measured rather than assigned: a module is `pure` only if its whole
# test set passes with torch, transformers, scikit-learn and matplotlib all
# made unimportable.
#
# NOTE: this block lives here and NOT in pyproject.toml. pytest.ini takes
# absolute precedence -- when it exists, [tool.pytest.ini_options] is not read
# at all. Keeping markers in pyproject while this file exists silently
# unregisters every one of them.
markers =
    pure: numpy/scipy/pytest only -- torch, transformers, sklearn, matplotlib all absent. The CI gating tier.
    deps: needs the heavy tier importable (torch/transformers/sklearn/matplotlib) but no model download and no run artifacts.
    smoke: needs real torch/transformers (SMOKE_REAL_DEPS=1), not the stubs
    heavy: needs real run artifacts on disk. Never runs in CI; deselect with -m 'not heavy'.

filterwarnings =
    error::pytest.PytestUnknownMarkWarning
