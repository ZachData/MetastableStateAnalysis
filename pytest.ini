[pytest]
# Live phases only. archive/ holds Phases 3, 4, 5, 5b, 5c and 6 — code that is
# not maintained, not imported by anything live, and whose tests are therefore
# not collected. See archive/README.md.
testpaths = tests
norecursedirs = archive .git __pycache__ results

markers =
    smoke: needs real torch/transformers (SMOKE_REAL_DEPS=1), not the stubs
